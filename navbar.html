<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barra de navegação</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <header class="sticky top-0 z-50 w-full border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
      
      <div class="flex items-center gap-3">
        <a href="#" class="flex items-center gap-2 text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">
          <svg class="h-8 w-8 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          <span class="text-base font-semibold tracking-tight">empresa</span>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-8" aria-label="Navegação principal">
        <a href="#recursos" class="text-sm font-medium text-slate-400 hover:text-slate-100 transition-colors">recursos</a>
        <a href="#solucoes" class="text-sm font-medium text-slate-400 hover:text-slate-100 transition-colors">soluções</a>
        <a href="#documentacao" class="text-sm font-medium text-slate-400 hover:text-slate-100 transition-colors">documentação</a>
        <a href="#precos" class="text-sm font-medium text-slate-400 hover:text-slate-100 transition-colors">preços</a>
      </nav>

      <div class="hidden md:flex items-center gap-4">
        <a href="#login" class="text-sm font-medium text-slate-300 hover:text-slate-100 transition-colors px-3 py-2 rounded">
          acessar conta
        </a>
        <a href="#cadastro" class="text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded transition-colors">
          começar agora
        </a>
      </div>

      <div class="flex md:hidden">
        <button
          id="mobile-menu-button"
          type="button"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-label="Alternar menu de navegação"
          class="p-2 text-slate-400 hover:text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded"
        >
          <svg id="icon-menu" class="h-6 w-6 block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg id="icon-close" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <div
      id="mobile-menu"
      class="hidden border-b border-slate-800 bg-slate-950/95 px-4 pt-2 pb-6 md:hidden backdrop-blur-md"
    >
      <nav class="flex flex-col space-y-3" aria-label="Navegação móvel">
        <a href="#recursos" class="mobile-nav-link text-sm font-medium text-slate-300 hover:text-slate-100 py-2 transition-colors">recursos</a>
        <a href="#solucoes" class="mobile-nav-link text-sm font-medium text-slate-300 hover:text-slate-100 py-2 transition-colors">soluções</a>
        <a href="#documentacao" class="mobile-nav-link text-sm font-medium text-slate-300 hover:text-slate-100 py-2 transition-colors">documentação</a>
        <a href="#precos" class="mobile-nav-link text-sm font-medium text-slate-300 hover:text-slate-100 py-2 transition-colors">preços</a>
        
        <div class="border-t border-slate-800 pt-4 flex flex-col gap-3">
          <a href="#login" class="mobile-nav-link text-center text-sm font-medium text-slate-300 hover:text-slate-100 py-2 transition-colors">
            acessar conta
          </a>
          <a href="#cadastro" class="mobile-nav-link text-center text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 py-2.5 rounded transition-colors">
            começar agora
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-2xl font-bold text-slate-100">conteúdo da página</h1>
    <p class="mt-4 text-slate-400">exemplo de barra de navegação com menu responsivo integrado.</p>
  </main>

  <script>
    const button = document.getElementById('mobile-menu-button');
    const menu = document.getElementById('mobile-menu');
    const iconMenu = document.getElementById('icon-menu');
    const iconClose = document.getElementById('icon-close');
    const mobileLinks = document.querySelectorAll('.mobile-nav-link');

    function openMenu() {
      button.setAttribute('aria-expanded', 'true');
      menu.classList.remove('hidden');
      iconMenu.classList.add('hidden');
      iconMenu.classList.remove('block');
      iconClose.classList.remove('hidden');
      iconClose.classList.add('block');
    }

    function closeMenu() {
      button.setAttribute('aria-expanded', 'false');
      menu.classList.add('hidden');
      iconMenu.classList.remove('hidden');
      iconMenu.classList.add('block');
      iconClose.classList.add('hidden');
      iconClose.classList.remove('block');
    }

    function toggleMenu() {
      const isExpanded = button.getAttribute('aria-expanded') === 'true';
      if (isExpanded) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    button.addEventListener('click', toggleMenu);

    mobileLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && button.getAttribute('aria-expanded') === 'true') {
        closeMenu();
        button.focus();
      }
    });

    const mediaQuery = window.matchMedia('(min-width: 768px)');
    mediaQuery.addEventListener('change', (e) => {
      if (e.matches && button.getAttribute('aria-expanded') === 'true') {
        closeMenu();
      }
    });
  </script>
</body>
</html>
