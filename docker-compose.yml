version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cproeis_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./comprovantes:/app/comprovantes
